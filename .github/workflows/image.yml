name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: sub2api
      namespace: finddata
